name: 每日DDL提醒

on:
  schedule:
    - cron: '0 1,13 * * *'
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        # 从 v4 更新到 v5
        uses: actions/checkout@v5

      - name: 设置 Python
        # 从 v5 更新到 v6
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          pip install requests python-dotenv

      - name: 运行提醒脚本
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python check_remind.py

      - name: 提交更新后的数据库
        # 从 v5 更新到 v6
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "自动更新数据库（已提醒标记）"
          file_pattern: tasks.db