name: 每日DDL提醒

on:
  schedule:
    - cron: '50 23,5 * * *'   # ← 改成这个：北京时间 7:50 和 13:50
  workflow_dispatch:

jobs:
  remind:
    permissions:           # 已配置写入权限
      contents: write
    runs-on: ubuntu-latest
    
    steps:
      - name: 拉取代码
        uses: actions/checkout@v5
        
      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          
      - name: 安装依赖
        run: |
          pip install requests python-dotenv
          
      - name: 运行提醒脚本
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python check_remind.py
        
      - name: 提交更新后的数据库
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "自动更新数据库（已提醒标记）"
          file_pattern: tasks.db