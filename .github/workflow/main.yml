name: 每日DDL提醒

on:
  schedule:
    - cron: '0 1,13 * * *'   # 每天 UTC 1:00 和 13:00 → 北京时间 9:00 和 21:00
  workflow_dispatch:          # 允许手动触发

jobs:
  remind:
    runs-on: ubuntu-latest
    
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: 安装依赖
        run: |
          pip install requests
          # 如果 check_remind.py 里有 win10toast，在 Linux 上会报错，我们需要处理一下
          
      - name: 运行提醒脚本
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python check_remind.py
        
      - name: 提交更新后的数据库
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "自动更新数据库（已提醒标记）"
          file_pattern: tasks.db